name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gym_tracker_app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android-Ordner erzeugen (falls nicht vorhanden)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name gym_tracker_app --org com.example _tmp_app
            cp -r _tmp_app/android android
            rm -rf _tmp_app
          fi

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gym-tracker-apk
          path: gym_tracker_app/build/app/outputs/flutter-apk/app-release.apk
